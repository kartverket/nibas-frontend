name: nibas-frontend-dev-deploy
on: workflow_dispatch

permissions:
  id-token: write
  contents: "read"

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      image_tag: ${{ steps.setOutput.outputs.image_tag }}

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: "npm"

      - name: Update npmrc with secret to install internal packages
        run: |
          cp .npmrc .npmrc-copy
          echo //npm.pkg.github.com/:_authToken=${{secrets.PAT_SCOPE_READ_PACKAGE}} >> .npmrc

      - name: Determine image version hash
        id: git_hash
        run: echo "git_hash=$(git rev-parse --short $GITHUB_SHA)" >> $GITHUB_OUTPUT      

      - name: Build and test
        run: |
          npm ci --no-audit
          npm audit --production
          npm run build --if-present
          npm test
        env:
          REACT_APP_VERSION: ${{ github.ref_name }}

      - name: Remove npmrc with secret
        run: |
          rm .npmrc
          mv .npmrc-copy .npmrc
      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_tag=${{ github.ref_name }}-${{ steps.git_hash.outputs.git_hash }}" >> $GITHUB_OUTPUT

  set-variables:
    runs-on: ubuntu-latest
    outputs:
      dev_auth_project_number: ${{ steps.set-dev-variables.outputs.dev_auth_project_number }}
      dev_service_account: ${{ steps.set-dev-variables.outputs.dev_service_account }}
    steps:
      - name: Set dev variables
        id: set-dev-variables
        run: |
          echo "dev_auth_project_number=747318126147" >> $GITHUB_OUTPUT
          echo "dev_service_account=nibas-deploy@nibas-dev-075c.iam.gserviceaccount.com" >> $GITHUB_OUTPUT

  deploy-dev:
    needs: [build, set-variables]
    permissions:
      id-token: write
      pull-requests: write
      contents: read
      packages: write
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v4.0.0
    with:
      runner: atkv1-dev
      environment: dev
      kubernetes_cluster: atkv1-dev
      terraform_workspace: dev
      terraform_option_1: -var-file=variables/dev.tfvars
      terraform_option_2: -var=NIBAS_FRONTEND_VERSION=${{ needs.build.outputs.image_tag }}
      terraform_init_option_1: -backend-config=backend/dev.gcs.tfbackend
      working_directory: terraform
      auth_project_number: ${{ needs.set-variables.outputs.dev_auth_project_number}}
      service_account: ${{ needs.set-variables.outputs.dev_service_account}}
      vault_role: nibas-frontend-read-role
      project_id: kubernetes-dev-94b9
      deploy_on: ${{ github.ref }}


 