name: nibas-frontend-feature-branches
on:
  push:
    branches-ignore: master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2
        
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 16.x

      - run: echo //npm.pkg.github.com/:_authToken=${{secrets.PAT_SCOPE_READ_PACKAGE}} >> .npmrc
      - run: npm ci --no-audit
      - run: npm run build --if-present
      - run: npm test

    - name: Verify API types are up to date
      run: |
        npm run update-api-types:remote-pathless -- --output ./new-types.ts
        cmp src/types/api-gen.ts ./new-types.ts
        rm ./new-types.ts
