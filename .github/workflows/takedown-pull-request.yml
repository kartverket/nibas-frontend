name: Takedown PR
on:
  workflow_dispatch:
    inputs:
      branch-name:
        description: "Name of the branch to takedown feature-branch"
        required: true
  pull_request:
    types:
      - closed

jobs:
  resolve-branch-name:
    uses: kartverket/nibas-frontend/.github/workflows/resolve-branch-name.yml@fix-pr-workflows
    with:
      branch-name: ${{ inputs.branch-name }}

  takedown-pull-request:
    needs: [resolve-branch-name]
    permissions:
      id-token: write
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') }}
    uses: kartverket/smia-apps/.github/workflows/delete-feature-branch.yml@main
    with:
      branch-name: ${{ needs.resolve-branch-name.outputs.BRANCH_NAME }}
      identity: nibas
