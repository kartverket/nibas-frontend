name: nibas-frontend

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  compile_test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v2
        
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 16.x

      - name: Build and test
        run: |
          npm ci --no-audit
          npm audit --production
          npm run build --if-present
          npm test

  build:
    needs: compile_test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}

    steps:
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.0
        with:
          github_token: ${{ github.token }}

      - name: Login to Github Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password:  ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: whoan/docker-build-with-cache-action@v5
        with:
          context: .
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ${{ env.registry }}
          image_tag: ${{ steps.tag_version.outputs.new_tag }}
          image_name: ${{ github.repository }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: atkv2-test-apps
    
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Authenticate with Google Cloud
      uses: google-github-actions/auth@v0
      with: 
        credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

    - name: Authenticate with cluster
      run: gcloud container hub memberships get-credentials atkv2-test-apps --verbosity debug

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v1

    - name: Generate terraform variables
      run: |
        cat <<EOF >> terraform.tfvars
        nibas_frontend_version="${{ needs.build.outputs.new_tag }}"
        EOF
    
    - name: Terraform init
      run: terraform init -input=false

    - name: Terraform plan
      run: terraform plan -input=false

    - name: Terraform apply
      run: terraform apply -input=false -auto-approve   