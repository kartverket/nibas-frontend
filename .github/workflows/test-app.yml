name: Test app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  test-vitest:
    name: Test Vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Tests
        run: npm test

  test-cypress:
    name: Test Cypress
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          build: npm ci
          start: npm run start:no-auth
          browser: chrome
