name: Test app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      actions: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}

      - name: Build Package
        run: |
          npm ci --no-audit
          npm audit --production
          npm run lint
          npm run build --if-present
        env:
          VITE_VERSION: ${{ steps.tag_version.outputs.new_version }}

  test-vitest:
    name: Test Vitest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Run Test
        run: |
          npm ci
          npm test

  test-cypress:
    name: Test Cypress
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the build package
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm start:no-auth
          browser: chrome
