name: Test app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-vitest:
    name: Test Vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Tests
        run: npm test
