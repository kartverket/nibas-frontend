name: Test app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  test-vitest:
    name: Test Vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Tests
        run: npm test
