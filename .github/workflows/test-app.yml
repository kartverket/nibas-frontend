name: Test app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  should-test:
    uses: kartverket/nibas-frontend/.github/workflows/check-changes.yml@main
    with:
      ignore-paths: "README.md,.github/,.vscode/,.security/"
  test-vitest:
    needs: should-test
    name: Test Vitest and build
    runs-on: ubuntu-latest
    if: needs.should-test.outputs.has-relevant-changes == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint

      - name: Build app
        run: npm run build

      - name: Tests
        run: npm test
