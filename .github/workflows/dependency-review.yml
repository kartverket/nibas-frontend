name: "Dependency Review"
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract GHSA allowlist from .nsprc
        id: nsprc
        run: |
          now_ms=$(( $(date +%s) * 1000 ))
          ghsas=$(jq -r --argjson now "$now_ms" '
            to_entries
            | map(select(.key | test("^GHSA-")))
            | map(select(
                (.value.active // true) == true
                and (
                  (.value.expiry // null) == null
                  or ((.value.expiry + "T00:00:00Z" | fromdateiso8601) * 1000 > $now)
                )
              ))
            | map(.key)
            | join("\n")
          ' .nsprc)
          echo "ghsas<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ghsas" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: true
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, Python-2.0, BlueOak-1.0.0, Zlib
          allow-ghsas: ${{ steps.nsprc.outputs.ghsas }}
