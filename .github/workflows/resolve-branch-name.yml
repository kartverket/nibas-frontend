name: Resolve Branch Name

on:
  workflow_call:
    inputs:
      branch-name:
        description: "Optional branch name override"
        required: false
        type: string
    outputs:
      BRANCH_NAME:
        description: "Resolved and validated branch name"
        value: ${{ jobs.validate-branch-name.outputs.branch-name }}

jobs:
  determine-branch-name:
    name: Determine Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch_name_output: ${{ steps.determine-branch.outputs.branch_name_output }}
    steps:
      - name: Determine branch name
        id: determine-branch
        run: |
          if [ "${{ inputs.branch-name }}" != "" ]; then
            echo "branch_name_output=${{ inputs.branch-name }}" >> $GITHUB_OUTPUT
          else
            echo "branch_name_output=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    needs: determine-branch-name
    outputs:
      branch-name: ${{ steps.validate.outputs.validated_branch_name }}
    steps:
      - name: Validate branch-name is valid hostname label
        id: validate
        run: |
          BRANCH_NAME="${{ needs.determine-branch-name.outputs.branch_name_output }}"
          if [[ ! "$BRANCH_NAME" =~ ^[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?$ ]]; then
            echo "❌ branch-name is invalid as hostname label: $BRANCH_NAME"
            exit 1
          fi
          echo "✅ branch-name is valid as hostname label: $BRANCH_NAME"
          echo "validated_branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
