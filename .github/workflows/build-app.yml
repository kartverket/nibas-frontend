name: Build app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      deploy_ghcr:
        description: "Deploy to ghcr?"
        default: "false"
        type: string
    outputs:
      version:
        description: "The version of the docker-image created"
        value: ${{ jobs.build.outputs.new_tag }}
      image_url:
        description: "The full URL to the docker-image created"
        value: ${{ jobs.build-image.outputs.image_url }}
      digest:
        description: "The digest of the built docker image"
        value: ${{ jobs.build-image.outputs.digest }}

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}

      - name: Build Package
        run: |
          npm ci --no-audit
          npm audit --production
          npm run build --if-present
        env:
          VITE_VERSION: ${{ steps.tag_version.outputs.new_version }}

      - name: Upload Build Package
        uses: actions/upload-artifact@v4
        with:
          name: build
          if-no-files-found: error
          path: build

  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: build
    outputs:
      image_url: ${{ steps.setOutput.outputs.image_url }}
      digest: ${{ steps.setOutput.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the build package
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ inputs.deploy_ghcr == 'true' }}
          tags: ${{ env.registry }}/${{ github.repository }}:${{ needs.build.outputs.new_tag }} , ${{ env.registry }}/${{ github.repository }}:latest
          build-args: |
            project_version_arg=${{ needs.build.outputs.new_tag }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
