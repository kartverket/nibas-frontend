name: Build app
on:
  merge_group:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      deploy_ghcr:
        description: "Deploy to ghcr?"
        default: false
        type: string
    outputs:
      version:
        description: "The version of the docker-image created"
        value: ${{ jobs.build.outputs.new_tag }}
      image_url:
        description: "The full URL to the docker-image created"
        value: ${{ jobs.build.outputs.image_url }}
      digest:
        description: "The digest of the built docker image"
        value: ${{ jobs.build.outputs.digest }}
    secrets:
      PAT_SCOPE_READ_PACKAGE:
        required: true

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      image_url: ${{ steps.setOutput.outputs.image_url }}
      digest: ${{ steps.setOutput.outputs.digest }}

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: "npm"

      - name: Update npmrc with secret to install internal packages
        run: |
          cp .npmrc .npmrc-copy
          echo //npm.pkg.github.com/:_authToken=${{secrets.PAT_SCOPE_READ_PACKAGE}} >> .npmrc
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}

      - name: Build and test
        run: |
          npm ci --no-audit
          npm audit --production
          npm run build --if-present
          npm test
        env:
          VITE_VERSION: ${{ steps.tag_version.outputs.new_version }}

      - name: Remove npmrc with secret
        run: |
          rm .npmrc
          mv .npmrc-copy .npmrc
      - name: Login to Github Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ inputs.deploy_ghcr == 'true' }}
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.tag_version.outputs.new_tag }} , ${{ env.registry }}/${{ github.repository }}:latest
          build-args: |
            project_version_arg=${{ steps.tag_version.outputs.new_tag }}

      - name: Set output with build values
        id: setOutput
        run: |
          echo "image_url=${{ env.registry }}/${{ github.repository }}@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "digest=${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
