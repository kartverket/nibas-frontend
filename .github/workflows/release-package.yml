name: Release app
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    permissions:
      contents: write
      packages: write
      security-events: write
      actions: read
    uses: kartverket/nibas-frontend/.github/workflows/build-app.yml@main
    with:
      deploy_ghcr: true
    secrets: inherit

  test:
    permissions:
      contents: write
      actions: read
    uses: kartverket/nibas-frontend/.github/workflows/test-app.yml@main
    secrets: inherit

  pharos:
    name: Run Pharos security scan
    needs: build
    permissions:
      actions: read
      packages: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: "Run Pharos"
        uses: kartverket/pharos@e5a5cf71dd41384d6d62c7d9b387851c0457e81b # v0.6.4
        with:
          allow_severity_level: critical
          image_url: ${{ needs.build.outputs.image_url }}

  deploy-dev:
    permissions:
      id-token: write
    needs: [build, test, pharos]
    uses: kartverket/smia-workflows/.github/workflows/deploy-app.yml@main
    with:
      application: nibas-frontend
      version: ${{ needs.build.outputs.version }}
      digest: ${{ needs.build.outputs.digest }}
      environment: dev
      namespace: nibas-main
      identity: nibas
