name: nibas-frontend
on:
  push:
    branches: master

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: [anthos, test]
    permissions:
      contents: write
      packages: write

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 16.x
          cache: "npm"

      - name: Update npmrc with secret to install internal packages
        run: echo //npm.pkg.github.com/:_authToken=${{secrets.PAT_READ_PACKAGE}} >> .npmrc

      - name: Build and test
        run: |
          npm ci --no-audit
          npm audit --production
          npm run build --if-present
          npm test

  bump-version:
    needs: build
    runs-on: [anthos, test]
    permissions:
      contents: write

    outputs:
      new_tag: ${{ steps.bump-version.outputs.newTag }}

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: "Update package.json and push new tag"
        uses: "phips28/gh-action-bump-version@master"
        id: "bump-version"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          major-wording: "MAJOR"
          minor-wording: "MINOR"
          patch-wording: ""
          rc-wording: ""

      - name: Login to Github Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: whoan/docker-build-with-cache-action@v5
        with:
          context: .
          username: ${{ github.actor }}
          password: ${{ github.token }}
          registry: ${{ env.registry }}
          image_tag: ${{ steps.bump-version.outputs.newTag }}
          image_name: ${{ github.repository }}

  deploy:
    needs: bump-version
    runs-on: [anthos, test]
    environment: atkv2-test-apps

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v0
        with:
          credentials_json: ${{ secrets.SERVICE_ACCOUNT_JSON }}

      - name: Authenticate with cluster
        run: gcloud container hub memberships get-credentials atkv2-test-apps --verbosity debug

      # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        uses: BlackDark/setup-terraform@proxy-custom-pkg
        with:
          terraform_wrapper: false

      - name: Generate terraform variables
        run: |
          cat <<EOF >> terraform.tfvars
          vault_addr="${{ secrets.VAULT_ADDR }}"
          vault_skip_verify="${{ secrets.VAULT_SKIP_VERIFY }}"
          vault_token="${{ secrets.VAULT_TOKEN }}"
          nibas_frontend_version="${{ needs.build.outputs.new_tag }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
