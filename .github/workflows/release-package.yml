name: nibas-frontend
on:
  push:
    branches: master

permissions:
  id-token: write
  contents: 'read'

env:
  image_name: nibas-frontend
  registry: ghcr.io
  registry_path: kartverket

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    outputs:
      new_tag: ${{ steps.bump-version.outputs.newTag }}

    steps:
      - name: checkout code
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: 16.x
          cache: "npm"

      - name: Update npmrc with secret to install internal packages
        run: |
          cp .npmrc .npmrc-copy
          echo //npm.pkg.github.com/:_authToken=${{secrets.PAT_SCOPE_READ_PACKAGE}} >> .npmrc

      - name: Build and test
        run: |
          npm ci --no-audit
          npm audit --production
          npm run build --if-present
          npm test

      - name: Remove npmrc with secret
        run: |
          rm .npmrc
          mv .npmrc-copy .npmrc

      - name: Update package.json and push new tag
        uses: "phips28/gh-action-bump-version@master"
        id: "bump-version"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          major-wording: "MAJOR"
          minor-wording: "MINOR"
          patch-wording: ""
          rc-wording: ""

      - name: Build with new package.json version
        run: npm run build --if-present

      - name: Login to Github Container Registry
        uses: docker/login-action@v1
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build docker and push
        id: build
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.registry }}/${{ github.repository }}:${{ steps.bump-version.outputs.newTag }}

  deploy:
    permissions:
      contents: read
      id-token: write
    needs: build
    runs-on: ${{ matrix.environment }}
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ['atkv1-dev']
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      # Fetch environment variables and set for subsequent steps
      - name: read .env
        uses: c-py/action-dotenv-to-setenv@v3
        with: 
          env-file: .github/workflows/.env.${{matrix.environment}}
        
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v0

      - name: Get JWT
        id: githubtoken
        uses: magic7s/expose-jwt-action@v0.1.1 

      - run: |
          echo "TF_VAR_GITHUB_TOKEN=${{ steps.githubtoken.outputs.jwt }}" >> $GITHUB_ENV
          
      # Authenticate with google cloud serviceaccount to have permissions in cluster.
      # Variabel project_id må settes til kubernetesprosjektet her.   
      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v0
        with:
          workload_identity_provider: ${{env.WORKLOAD_IDENTITY_FEDERATION_PROVIDER}}
          service_account: ${{env.WORKLOAD_IDENTITY_FEDERATION_SERVICE_ACCOUNT}}
          project_id: ${{env.TF_VAR_PROJECT_ID}}

      - name: Authenticate with cluster
        run: gcloud container hub memberships get-credentials ${{ matrix.environment }} --verbosity debug
        # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_wrapper: false

      - name: Generate terraform variables
        run: |
          cat <<EOF >> terraform.tfvars
          vault_addr="${{ env.VAULT_ADDR }}"
          vault_skip_verify="${{ secrets.VAULT_SKIP_VERIFY }}"
          nibas_frontend_version="${{ needs.build.outputs.new_tag }}"
          EOF

      - name: Generate terraform backend variables
        run: |
          cat <<EOF >> backend.tfbackend
          bucket="${{ env.BUCKET }}"
          EOF

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.tfbackend

      - name: Terraform plan
        run: terraform plan -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

deploy-test:
    needs: build
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    uses: kartverket/github-workflows/.github/workflows/run-terraform.yml@v2.7.5
    with:
      runner: atkv1-test
      environment: test
      kubernetes_cluster: atkv1-test
      terraform_workspace: test
      terraform_options: -var-file=variables/test.tfvars -var=NIBAS_FRONTEND_VERSION=${{ needs.build.outputs.new_tag }}
      terraform_backend_config: -backend-config=backend/test.gcs.tfbackend
      working_directory: terraform
      workload_identity_provider: projects/935702487708/locations/global/workloadIdentityPools/nibas-deploy-pool/providers/github-provider
      service_account: nibas-deploy@nibas-test-36cb.iam.gserviceaccount.com
      vault_role: nibas-frontend-read-role
      project_id: kubernetes-test-94f6
      deploy_on: 'refs/heads/master'