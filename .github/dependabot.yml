version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: daily

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: daily

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: daily
    groups:
      dependencies:
        patterns:
          - "*"
