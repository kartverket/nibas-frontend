apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: nibas-frontend
  namespace: nibas
spec:
  selector:
    istio: ingressgateway # use Istio default gateway implementation
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "nibas.test.skip.statkart.no"